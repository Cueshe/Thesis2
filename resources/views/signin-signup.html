<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-md mx-auto bg-white rounded-2xl shadow-xl p-8">
        <!-- Tab Headers -->
        <div class="flex border-b border-gray-200 mb-8">
            <button id="signInTab" class="flex-1 py-3 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none">
                Sign In
            </button>
            <button id="signUpTab" class="flex-1 py-3 text-center font-semibold text-gray-500 focus:outline-none">
                Sign Up
            </button>
        </div>

        <!-- Sign In Form -->
        <form id="signInForm" class="space-y-6">
            <h2 class="text-3xl font-bold text-center text-gray-800">Welcome Back!</h2>
            <div>
                <label for="signInEmail" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="signInEmail" name="email" required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <label for="signInPassword" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="signInPassword" name="password" required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox"
                        class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-900">Remember me</label>
                </div>
                <div class="text-sm">
                    <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500">Forgot password?</a>
                </div>
            </div>
            <div>
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-300">
                    Sign In
                </button>
            </div>
        </form>

        <!-- Sign Up Form -->
        <form id="signUpForm" class="hidden space-y-6">
             <h2 class="text-3xl font-bold text-center text-gray-800">Create an Account</h2>
            <div>
                <label for="signUpEmail" class="block text-sm font-medium text-gray-700">Email Address</label>
                <input type="email" id="signUpEmail" name="email" required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <label for="signUpPassword" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="signUpPassword" name="password" required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
             <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirm-password" required
                    class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-300">
                    Create Account
                </button>
            </div>
        </form>
    </div>

    <script>
        const signInTab = document.getElementById('signInTab');
        const signUpTab = document.getElementById('signUpTab');
        const signInForm = document.getElementById('signInForm');
        const signUpForm = document.getElementById('signUpForm');

        // Function to switch to Sign In view
        function showSignIn() {
            signInTab.classList.add('border-indigo-600', 'text-indigo-600');
            signInTab.classList.remove('text-gray-500');

            signUpTab.classList.remove('border-indigo-600', 'text-indigo-600');
            signUpTab.classList.add('text-gray-500');

            signInForm.classList.remove('hidden');
            signUpForm.classList.add('hidden');
        }

        // Function to switch to Sign Up view
        function showSignUp() {
            signUpTab.classList.add('border-indigo-600', 'text-indigo-600');
            signUpTab.classList.remove('text-gray-500');
            
            signInTab.classList.remove('border-indigo-600', 'text-indigo-600');
            signInTab.classList.add('text-gray-500');

            signUpForm.classList.remove('hidden');
            signInForm.classList.add('hidden');
        }

        // Event Listeners for tabs
        signInTab.addEventListener('click', showSignIn);
        signUpTab.addEventListener('click', showSignUp);

        // Optional: Prevent default form submission for this example
        signInForm.addEventListener('submit', function(e) {
            e.preventDefault();
            console.log('Sign In form submitted');
            // Here you would typically handle the login logic
        });

        signUpForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('signUpPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }
            console.log('Sign Up form submitted');
            // Here you would typically handle the registration logic
        });
    </script>

</body>
</html>
